tag_prefix = "v"
from_latest_tag = true
ignore_merge_commits = true
ignore_fixup_commits = true
scopes = [
  "ir",
  "read",
  "check",
  "eval",
  "runtime",
  "print",
  "cli",
  "proof",
  "corpus",
  "toolchain",
  "git",
  "design",
  "roadmap",
  "release",
  "process",
  "float",
  "approx",
  "math",
  "decimal",
  "codec",
  "experiment",
]

[git_hooks.commit-msg]
script = """#!/bin/sh
set -e
cog verify --file "$1"
"""
